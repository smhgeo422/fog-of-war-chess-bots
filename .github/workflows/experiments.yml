name: Fog of War validation

on:
  pull_request:
  push:
    branches: [main, 'infra/**', 'experiment/**']
  workflow_dispatch:
    inputs:
      config:
        description: Optional tracked experiment JSON path
        required: false
        type: string

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.9'
          enable-cache: true
      - name: Compile, test and run integration smoke
        run: tools/check-experiments.sh
      - name: Preserve validation logs and replays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/research/checks/*.log
            data/research/setup/*.log
            data/research/runs/ci-smoke/
          retention-days: 30

  experiment:
    if: (github.event_name == 'workflow_dispatch' && inputs.config != '') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/experiment/') && contains(github.event.head_commit.message, '[run experiment]'))
    needs: checks
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.9'
          enable-cache: true
      - name: Build and run tracked experiment
        env:
          EXPERIMENT_CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          if [[ -z "$EXPERIMENT_CONFIG" ]]; then
            branch_name="$GITHUB_REF_NAME"
            id_part="${branch_name#experiment/}"
            research_id="${id_part%%-*}"
            [[ "$research_id" =~ ^(P[1-9]|[A-F][0-9]{2}|Infra)$ ]]
            EXPERIMENT_CONFIG="experiments/configs/$research_id.json"
          fi
          [[ "$EXPERIMENT_CONFIG" =~ ^experiments/configs/[a-zA-Z0-9_-]+\.json$ ]]
          research_id="${EXPERIMENT_CONFIG##*/}"
          research_id="${research_id%.json}"
          [[ "$research_id" =~ ^(P[1-9]|[A-F][0-9]{2}|Infra)$ ]] || { echo "Invalid experiment research ID"; exit 1; }
          if [[ "$research_id" =~ ^P[1-9]$ ]]; then
            if [[ "$GITHUB_REF_NAME" == experiment/* ]]; then
              id_part="${GITHUB_REF_NAME#experiment/}"
              version="${id_part#"$research_id"-}"
              version="${version%%-*}"
              [[ "$version" =~ ^v(0|[1-9][0-9]*)$ ]] || { echo "Invalid P project variant"; exit 1; }
              python3 - "$EXPERIMENT_CONFIG" "$research_id" "$version" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          if data.get("project_id") != sys.argv[2] or data.get("variant") != sys.argv[3]:
              raise SystemExit("Project/variant config does not match branch")
          PY
            fi
          fi
          echo "RESEARCH_ID=$research_id" >> "$GITHUB_ENV"
          echo "EXPERIMENT_CONFIG=$EXPERIMENT_CONFIG" >> "$GITHUB_ENV"
          git ls-files --error-unmatch -- "$EXPERIMENT_CONFIG"
          candidate=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["candidate"])' "$EXPERIMENT_CONFIG")
          baseline=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("baseline", "obscuro_v4"))' "$EXPERIMENT_CONFIG")
          extra=()
          for bot in "$candidate" "$baseline"; do
            [[ "$bot" =~ ^[a-zA-Z0-9_-]+$ ]]
            if [[ -f "bots/$bot/REQUIRE_STOCKFISH" || -f "bots/$bot/REQUIRE_POSITIONS" ]]; then
              extra+=("$bot")
            fi
          done
          mkdir -p data/research/checks
          tools/setup-experiments.sh "${extra[@]}" 2>&1 | tee data/research/checks/setup.log
          timeout --kill-after=45s 330m .venv/bin/python tools/experiment.py "$EXPERIMENT_CONFIG" \
            --id "actions-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" 2>&1 | tee data/research/checks/experiment.log
      - name: Package complete research evidence with checksums
        if: always()
        run: |
          set -euo pipefail
          run_dir="data/research/runs/actions-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ ! -d "$run_dir" ]]; then
            echo "Experiment did not produce a run directory; logs are still preserved."
            exit 1
          fi
          python3 tools/archive_research_run.py \
            --run "$run_dir" \
            --output data/research/archive \
            --research-id "${RESEARCH_ID:-Infra}"
      - name: Publish durable game evidence and verify remote bytes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .venv/bin/python tools/persist_research_evidence.py --archive-dir data/research/archive --type game
      - name: Preserve experiment and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/research/checks/*.log
            data/research/setup/*.log
            data/research/runs/
            data/research/archive/
          retention-days: 90

  offline:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/experiment/') && contains(github.event.head_commit.message, '[run offline]')
    needs: checks
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.9'
          enable-cache: true
      - name: Install locked offline Python environment
        run: uv sync --locked --python 3.14.10
      - name: Produce tracked offline research evidence
        run: |
          set -euo pipefail
          name="${GITHUB_REF_NAME#experiment/}"
          research_id="${name%%-*}"
          [[ "$research_id" =~ ^P[1-9]$ ]] || { echo "Offline project must be P1..P9"; exit 1; }
          cfg="experiments/offline/$research_id.json"
          git ls-files --error-unmatch "$cfg"
          echo "RESEARCH_ID=$research_id" >> "$GITHUB_ENV"
          mkdir -p data/research/offline_runs
          .venv/bin/python tools/run_offline_experiment.py "$cfg" \
            --run "data/research/offline_runs/actions-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Verify and package offline evidence with checksums
        if: always()
        run: |
          set -euo pipefail
          run="data/research/offline_runs/actions-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test -d "$run"
          .venv/bin/python tools/archive_offline_run.py \
            --run "$run" --output data/research/offline_archive \
            --research-id "${RESEARCH_ID:?missing research ID}"

      - name: Publish durable offline evidence and verify remote bytes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .venv/bin/python tools/persist_research_evidence.py --archive-dir data/research/offline_archive --type offline
      - name: Preserve offline job and archive in temporary Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/research/offline_runs/
            data/research/offline_archive/
          retention-days: 90
